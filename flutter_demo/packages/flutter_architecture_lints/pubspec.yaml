name: flutter_architecture_lints
description: >
  团队级 Flutter 架构约束 custom_lint 规则集。
  对应 4 条 P0/P1 架构编码规范：
  1. must_dispose_change_notifier_with_listener
  2. no_new_listenable_in_animated_builder_param
  3. dispose_all_listenable_fields_in_state
  4. prefer_symmetric_add_remove_listener
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  analyzer: ^6.4.0
  analyzer_plugin: ^0.11.2
  custom_lint: ^0.6.4
  custom_lint_builder: ^0.6.4
  meta: ^1.11.0
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
